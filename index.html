<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>USCCS Check-In / Match Report</title>
  <style>
    body { font-family: -apple-system, sans-serif; padding: 24px; max-width: 700px; margin: 0 auto; }
    pre { background: #f4f6fa; padding: 16px; border-radius: 8px; overflow-x: auto; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Stage 1 test page</h1>
  <p>This is a placeholder — real Check-In / Match Report UI comes in later stages.</p>
  <p>This page just proves the deep-link resolution endpoint works end to end.</p>
  <div id="output">Loading...</div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const gameId = params.get('game');
    const output = document.getElementById('output');

    if (!gameId) {
      output.innerHTML = '<p>No <code>?game=&lt;uid&gt;</code> parameter in the URL. Add one to test, e.g.:<br><code>' +
        window.location.origin + window.location.pathname + '?game=SOME-GAME-UID</code></p>';
    } else {
      fetch('/api/game/' + encodeURIComponent(gameId))
        .then(res => res.json())
        .then(data => {
          if (data.error) {
            output.innerHTML = '<p style="color:red;">Error: ' + data.error + '</p>';
            return;
          }
          output.innerHTML = '<h3>Event</h3><pre>' + JSON.stringify(data.event, null, 2) + '</pre>' +
            '<h3>Teams + Rosters</h3><pre>' + JSON.stringify(data.teams, null, 2) + '</pre>';
        })
        .catch(err => {
          output.innerHTML = '<p style="color:red;">Fetch failed: ' + err.message + '</p>';
        });
    }
  </script>
</body>
</html>
